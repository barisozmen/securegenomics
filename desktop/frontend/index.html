<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SecureGenomics</title>
  <script>window.__SG_TOKEN__ = "%%SG_TOKEN%%";</script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app" class="app is-loading">

    <!-- Sidebar -->
    <aside class="rail">
      <div class="rail__brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__word">SecureGenomics</span>
      </div>

      <nav class="rail__nav" id="nav" hidden>
        <button class="nav__item" data-view="overview"><span class="nav__ico">◆</span>Overview</button>
        <button class="nav__item" data-view="projects"><span class="nav__ico">▤</span>Projects</button>
        <button class="nav__item" data-view="protocols"><span class="nav__ico">❯</span>Protocols</button>
        <button class="nav__item" data-view="local"><span class="nav__ico">◐</span>Local analysis</button>
        <button class="nav__item" data-view="activity"><span class="nav__ico">↻</span>Activity</button>
      </nav>

      <div class="rail__foot">
        <div class="conn" id="conn">
          <span class="conn__dot" id="connDot"></span>
          <span class="conn__label" id="connLabel">Checking…</span>
        </div>
        <div class="acct" id="acct" hidden>
          <span class="acct__avatar" id="acctAvatar"></span>
          <span class="acct__email" id="acctEmail"></span>
          <button class="acct__out" id="signOut" title="Sign out">Sign out</button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main" id="main">
      <div class="boot" id="boot"><span class="spinner"></span> Connecting to the engine…</div>
    </main>
  </div>

  <!-- Toasts -->
  <div class="toasts" id="toasts"></div>

  <!-- Modal host -->
  <div class="modal-host" id="modalHost" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
